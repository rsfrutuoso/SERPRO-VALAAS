name: Azure deploy - validator-service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'validator-service/**'
      - '.github/workflows/azure-deploy.yml'

env:
  RESOURCE_GROUP: rg-valaas
  CONTAINER_APP_NAME: ca-valaas-validator
  CONTAINER_APP_ENVIRONMENT: cae-valaas
  ACR_NAME: acrvalaas
  IMAGE_NAME: validator-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image "$IMAGE_NAME:${GITHUB_SHA::7}" \
            ./validator-service

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA::7}" \
            --set-env-vars SPRING_PROFILES_ACTIVE=docker
