spring:
  application:
    name: validator-service
  datasource:
    url: jdbc:postgresql://localhost:5432/valaas
    username: valaas
    password: valaas
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

valaas:
  cache:
    enabled: ${VALAAS_CACHE_ENABLED:false}
  messaging:
    enabled: ${VALAAS_MESSAGING_ENABLED:false}
  security:
    username: ${VALAAS_SECURITY_USERNAME:valaas-admin}
    password: ${VALAAS_SECURITY_PASSWORD:change-me-strong-password}

nats:
  url: ${NATS_URL:nats://localhost:4222}
